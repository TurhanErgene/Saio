# Push a tag like v2.0.0 to build Saio.exe and attach it to a GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm saio.spec
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/Saio.exe
          generate_release_notes: true
